{% extends "base.html" %}
{% block title %}แก้ไขวัตถุดิบ - Admin{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="bg-white rounded-2xl ring-1 ring-gray-100 p-6 space-y-4">
    <h1 class="text-lg font-bold text-gray-900">แก้ไขวัตถุดิบ</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm text-gray-700 mb-1">ชื่อ</label>
        <input name="name" value="{{ ing.name }}" class="w-full px-4 py-2 rounded-xl ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-gray-700 mb-1">source</label>
          <input name="source" value="{{ ing.source }}" class="w-full px-4 py-2 rounded-xl ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-700 mb-1">ราคา</label>
          <input type="number" step="0.01" name="price" value="{{ ing.price }}" class="w-full px-4 py-2 rounded-xl ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-gray-700 mb-1">size_grams</label>
          <input type="number" step="0.01" name="size_grams" value="{{ ing.size_grams }}" class="w-full px-4 py-2 rounded-xl ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-700 mb-1">price_per_gram</label>
          <input type="number" step="0.0001" name="price_per_gram" value="{{ ing.price_per_gram }}" class="w-full px-4 py-2 rounded-xl ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none">
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <a href="{% url 'menus:admin_ingredient_list' %}" class="px-4 py-2 rounded-xl bg-gray-100 hover:bg-gray-200">ยกเลิก</a>
        <button class="px-4 py-2 rounded-xl bg-primary text-white hover:bg-primary-dark">บันทึก</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
