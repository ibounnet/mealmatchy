{% extends "base.html" %}
{% block title %}ขอเพิ่มเมนู{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto">
  <div class="bg-white rounded-2xl ring-1 ring-gray-100 shadow-sm p-6">
    <h1 class="text-xl font-bold text-gray-900 mb-4">ขอเพิ่มเมนู (ส่งคำขอ)</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 mb-1">เลือกร้าน (ที่อนุมัติแล้ว)</label>
          <select name="restaurant"
                  class="w-full px-4 py-2 rounded-xl bg-white ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
            <option value="">-- ไม่เลือก (กรอกชื่อร้านเอง) --</option>
            {% for r in restaurants %}
              <option value="{{ r.id }}">{{ r.name }}</option>
            {% endfor %}
          </select>
          <p class="text-xs text-gray-500 mt-1">ถ้าเลือกร้าน ระบบจะเติมชื่อร้านให้เอง</p>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">ชื่อร้าน (กรณีไม่เลือกจากระบบ)</label>
          <input name="restaurant_name"
                 class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"
                 placeholder="เช่น ร้านข้าวแกงหน้าตึก...">
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">ชื่อเมนู</label>
        <input name="name"
               class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"
               placeholder="เช่น ผัดกะเพราหมูสับ">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 mb-1">ราคา (บาท)</label>
          <input name="price" type="number" step="0.01"
                 class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"
                 placeholder="เช่น 50">
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">รูปภาพ</label>
          <input name="image" type="file"
                 class="w-full px-4 py-2 rounded-xl bg-white ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">รายละเอียด</label>
        <textarea name="description" rows="4"
                  class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"
                  placeholder="ใส่รายละเอียดเพิ่มเติมได้"></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <a href="{% url 'menus:menu_list' %}"
           class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200">
          ยกเลิก
        </a>
        <button class="px-4 py-2 rounded-xl bg-primary text-white hover:bg-primary-dark font-semibold">
          ส่งคำขอ
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
