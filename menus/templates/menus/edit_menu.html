{% extends "base.html" %}
{% block title %}แก้ไขเมนู{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto">
  <div class="bg-white rounded-2xl ring-1 ring-gray-100 shadow-sm p-6">
    <h1 class="text-xl font-bold text-gray-900 mb-4">แก้ไขเมนู</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 mb-1">เลือกร้าน</label>
          <select name="restaurant"
                  class="w-full px-4 py-2 rounded-xl bg-white ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
            <option value="">-- ไม่เลือก --</option>
            {% for r in restaurants %}
              <option value="{{ r.id }}" {% if menu.restaurant and menu.restaurant.id == r.id %}selected{% endif %}>
                {{ r.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">ชื่อร้าน (กรณีไม่เลือก)</label>
          <input name="restaurant_name" value="{{ menu.restaurant_name }}"
                 class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">ชื่อเมนู</label>
        <input name="name" value="{{ menu.name }}"
               class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-gray-700 mb-1">ราคา</label>
          <input name="price" type="number" step="0.01" value="{{ menu.price }}"
                 class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">รูปภาพ (อัปเดตได้)</label>
          <input name="image" type="file"
                 class="w-full px-4 py-2 rounded-xl bg-white ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">รายละเอียด</label>
        <textarea name="description" rows="4"
                  class="w-full px-4 py-2 rounded-xl bg-gray-50 ring-1 ring-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">{{ menu.description }}</textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <a href="{% url 'menus:menu_list' %}"
           class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200">
          ยกเลิก
        </a>
        <button class="px-4 py-2 rounded-xl bg-primary text-white hover:bg-primary-dark font-semibold">
          บันทึก
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
