{% extends "base.html" %}
{% block title %}ลบเมนู{% endblock %}
{% block content %}

<div class="max-w-xl mx-auto">
  <div class="bg-white rounded-2xl ring-1 ring-gray-100 shadow-sm p-6">
    <h1 class="text-xl font-bold text-gray-900">ยืนยันลบเมนู</h1>
    <p class="text-gray-700 mt-2">
      ต้องการลบเมนู <span class="font-semibold">{{ menu.name }}</span> ใช่หรือไม่
    </p>

    <form method="post" class="mt-6 flex justify-end gap-2">
      {% csrf_token %}
      <a href="{% url 'menus:menu_list' %}"
         class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200">
        ยกเลิก
      </a>
      <button class="px-4 py-2 rounded-xl bg-red-600 text-white hover:bg-red-700 font-semibold">
        ลบเมนู
      </button>
    </form>
  </div>
</div>

{% endblock %}
